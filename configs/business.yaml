# Business-case parameters (read by python -m shahid.business_model).
# Every entry: value, unit, currency, tag (FACT | ESTIMATE | DESIGN CHOICE | ASSUMPTION), source, note.
# A FACT carries its source and access date; the quoted sentence was checked on the access date.
# A cost with no public source stays null: the model then prints its formula instead of a number.
# Change a value here, rerun the model, and every table follows.

facts:
  steg_avg_selling_price_2025:
    value: 290.7
    unit: millimes per kWh
    currency: TND
    tag: FACT
    source: "Managers, 29 June 2026, 'Steg : l'électricité est vendue 290,7 millimes, mais coûte 456,3 millimes à produire', https://managers.tn/2026/06/29/steg-lelectricite-est-vendue-2907-millimes-mais-coute-4563-millimes-a-produire/ (accessed 2026-10-14)"
    note: "press source; average over 2025"
  steg_avg_production_cost_2025:
    value: 456.3
    unit: millimes per kWh
    currency: TND
    tag: FACT
    source: "same article as steg_avg_selling_price_2025"
    note: "STEG sells below its average production cost"
  steg_network_losses:
    value: 19.7
    unit: percent
    currency: null
    tag: FACT
    source: "same article as steg_avg_selling_price_2025"
    note: "network losses as reported; SHAHID does not address losses or theft"
  douz_customers:
    value: 24400
    unit: customers
    currency: null
    tag: FACT
    source: "Managers, 15 July 2026, 'À Douz, la Steg renforce un réseau électrique de 913 km', https://managers.tn/2026/07/15/a-douz-la-steg-renforce-un-reseau-electrique-de-913-km/ (accessed 2026-10-14)"
    note: "'près de 24 400 clients'"
  douz_transformer_substations:
    value: 149
    unit: transformer substations
    currency: null
    tag: FACT
    source: "same article as douz_customers"
    note: "'un parc de 149 postes de transformation électrique'"
  douz_staff:
    value: 17
    unit: staff
    currency: null
    tag: FACT
    source: "same article as douz_customers"
    note: "'un effectif de 17 agents et cadres'"
  douz_lv_line_km:
    value: 639
    unit: km
    currency: null
    tag: FACT
    source: "same article as douz_customers"
    note: "'639 km de lignes basse tension'"
  steg_subscribers:
    value: 4700000
    unit: subscribers
    currency: null
    tag: FACT
    source: "La Presse, 18 February 2025, 'STEG et SONEDE : Les dettes clients dépassent 4,8 milliards de dinars', https://www.lapresse.tn/2025/02/18/steg-et-sonede-les-dettes-clients-depassent-48-milliards-de-dinars/ (accessed 2026-10-14)"
    note: "'environ 4,7 millions d'abonnés', mostly residential low-voltage connections"
  data_protection_draft_law_articles:
    value: 132
    unit: articles
    currency: null
    tag: FACT
    source: "Business News, 18 February 2026, 'ARP : audition autour du projet de loi sur la protection des données personnelles', https://businessnews.com.tn/?p=1388983 (accessed 2026-10-14)"
    note: "draft organic law heard on 17 February 2026; motivated by the limits of Organic Law 2004-63 and names AI data processing"
  bct_tnd_per_usd:
    value: 3.0085
    unit: TND per USD
    currency: TND
    tag: FACT
    source: "La Presse, 11 October 2026, citing the Central Bank of Tunisia (interbank average rate of 8 October 2026), https://www.lapresse.tn/?p=4364398 (accessed 2026-10-14)"
    note: "the only exchange rate used; update here"

