  review_minutes_per_item:
    value: [2, 5, 10]
    unit: minutes per human item
    currency: null
    tag: DESIGN CHOICE
    source: null
    note: "grid of review times; no operator has been timed"
  pilot_district_substations:
    value: 149
    unit: transformer substations
    currency: null
    tag: ESTIMATE
    source: "douz_transformer_substations"
    note: "example pilot district of the size of one STEG agency; assumes the per-transformer rates of the simulated grids transfer"
  recalibration_interval_days:
    value: 90
    unit: days
    currency: null
    tag: DESIGN CHOICE
    source: null
    note: "detect.fit on each transformer's own fault-free data, and after every topology change"
  timing_budget_seconds:
    value: 300
    unit: seconds
    currency: null
    tag: DESIGN CHOICE
    source: null
    note: "upper bound on the compute benchmark"

