# Theme of the operator UI preview (ui/app.py): dark control-room style; verdict accents live in ui/theme.py.
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"
borderColor = "#1e293b"
redColor = "#ef4444"
orangeColor = "#f59e0b"
blueColor = "#3b82f6"
baseRadius = "small"
font = "sans-serif"

[client]
toolbarMode = "minimal"
