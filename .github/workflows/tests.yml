# Installs the pinned dependencies and runs the test suite on Ubuntu and Windows, Python 3.11.
# Status: NOT RUN until the branch is pushed and a workflow result is seen (see README).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SHAHID_WORKERS: "2"
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history of every branch and tag: cited commits must resolve
      - name: Fetch all branches and tags
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Test suite
        run: python -m pytest -q
      - name: Number integrity
        run: python -m shahid.check_numbers
